name: Ultimate Pipeline Test

# This tells the robot to wake up every time you push code
on:
  push:
    branches:
      - main

jobs:
  prove-it-works:
    runs-on: ubuntu-latest

    steps:
      - name: Print a custom message
        run: echo "BOOM! The pipeline is alive, listening, and working perfectly!"

      - name: Check the server time
        run: date

      - name: List the server directories
        run: ls -la